name: release

# Builds the prebuilt library matrix and attaches artifacts to a GitHub Release.
# NOTE: the cross-compilation legs require toolchains that are not available on
# the development machine; only the Windows x86_64 and wasm legs were built
# locally. Treat the others as CI-only until a CI run has produced them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: win-arm64
          - os: macos-latest
            target: universal-apple-darwin
            name: macos-universal
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}
      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add macOS targets
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release -p cf-ffi --target x86_64-apple-darwin
            cargo build --release -p cf-ffi --target aarch64-apple-darwin
          else
            cargo build --release -p cf-ffi --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            lipo -create -output dist/${{ matrix.name }}/libcleanfield.dylib \
              target/x86_64-apple-darwin/release/libcleanfield.dylib \
              target/aarch64-apple-darwin/release/libcleanfield.dylib
          else
            find target/${{ matrix.target }}/release -maxdepth 1 \
              \( -name 'cleanfield.dll' -o -name 'cleanfield.lib' \
              -o -name 'libcleanfield.so' -o -name 'libcleanfield.a' \
              -o -name 'libcleanfield.dylib' \) -exec cp {} dist/${{ matrix.name }}/ \;
          fi
          cp include/cleanfield.h dist/${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown -p cf-wasm
      - run: |
          mkdir -p dist/wasm
          cp target/wasm32-unknown-unknown/release/cf_wasm.wasm dist/wasm/
          cp web/worklet-processor.js dist/wasm/
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/wasm

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android targets and NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Build
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cargo ndk -t $abi -o dist/android/$abi build --release -p cf-ffi
          done
          cp include/cleanfield.h dist/android/
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/android

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: |
          cargo build --release -p cf-ffi --target aarch64-apple-ios
          cargo build --release -p cf-ffi --target aarch64-apple-ios-sim
          mkdir -p dist/ios
          cp target/aarch64-apple-ios/release/libcleanfield.a dist/ios/libcleanfield-device.a
          cp target/aarch64-apple-ios-sim/release/libcleanfield.a dist/ios/libcleanfield-sim.a
          cp include/cleanfield.h dist/ios/
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/ios

  publish:
    needs: [build, wasm, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
            dist/SHA256SUMS

