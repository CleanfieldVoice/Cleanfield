name: release

# Builds the prebuilt library matrix and attaches artifacts to a GitHub Release.
# All eight targets build on hosted runners; the linux arm64 leg needs the
# aarch64 cross linker installed below.

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win-x64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: win-arm64
          - os: macos-latest
            target: universal-apple-darwin
            name: macos-universal
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}
      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Add macOS targets
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release -p cf-ffi --target x86_64-apple-darwin
            cargo build --release -p cf-ffi --target aarch64-apple-darwin
          else
            cargo build --release -p cf-ffi --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.name }}
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            lipo -create -output dist/${{ matrix.name }}/libcleanfield.dylib \
              target/x86_64-apple-darwin/release/libcleanfield.dylib \
              target/aarch64-apple-darwin/release/libcleanfield.dylib
          else
            find target/${{ matrix.target }}/release -maxdepth 1 \
              \( -name 'cleanfield.dll' -o -name 'cleanfield.lib' \
              -o -name 'libcleanfield.so' -o -name 'libcleanfield.a' \
              -o -name 'libcleanfield.dylib' \) -exec cp {} dist/${{ matrix.name }}/ \;
          fi
          cp include/cleanfield.h dist/${{ matrix.name }}/
          # One archive per platform: release assets share a flat namespace, so
          # loose files with the same basename would overwrite each other.
          tar -czf "dist/${{ matrix.name }}.tar.gz" -C "dist/${{ matrix.name }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --release --target wasm32-unknown-unknown -p cf-wasm
      - run: |
          mkdir -p dist/wasm
          cp target/wasm32-unknown-unknown/release/cf_wasm.wasm dist/wasm/
          cp web/worklet-processor.js dist/wasm/
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/wasm

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android targets and NDK
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Build
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cargo ndk -t $abi -o dist/android/$abi build --release -p cf-ffi
            tar -czf "dist/android-$abi.tar.gz" -C "dist/android/$abi" .
          done
          tar -czf "dist/cleanfield.h.tar.gz" -C include cleanfield.h
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.tar.gz

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - run: |
          cargo build --release -p cf-ffi --target aarch64-apple-ios
          cargo build --release -p cf-ffi --target aarch64-apple-ios-sim
          mkdir -p dist/ios
          cp target/aarch64-apple-ios/release/libcleanfield.a dist/ios/libcleanfield-device.a
          cp target/aarch64-apple-ios-sim/release/libcleanfield.a dist/ios/libcleanfield-sim.a
          cp include/cleanfield.h dist/ios/
          tar -czf "dist/ios.tar.gz" -C dist/ios .
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/ios.tar.gz

  node-addon:
    name: node addon (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,  name: win32-x64,    asset: cf-node-win32-x64.node }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: win32-arm64,  asset: cf-node-win32-arm64.node }
          - { os: macos-latest,   target: universal-apple-darwin,  name: darwin-univ,  asset: cf-node-darwin-universal.node }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, name: linux-x64,   asset: cf-node-linux-x64.node }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, name: linux-arm64, asset: cf-node-linux-arm64.node }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install target
        if: matrix.target != 'universal-apple-darwin'
        run: rustup target add ${{ matrix.target }}
      - name: Add macOS targets
        if: matrix.target == 'universal-apple-darwin'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Install cross linker (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build addon
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          if [ "${{ matrix.target }}" = "universal-apple-darwin" ]; then
            cargo build --release -p cf-node --target x86_64-apple-darwin
            cargo build --release -p cf-node --target aarch64-apple-darwin
          else
            cargo build --release -p cf-node --target ${{ matrix.target }}
          fi
      - name: Package addon
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.name }}" in
            win32-*)
              src="target/${{ matrix.target }}/release/cf_node.dll" ;;
            darwin-*)
              lipo -create -output "dist/${{ matrix.asset }}" \
                target/x86_64-apple-darwin/release/libcf_node.dylib \
                target/aarch64-apple-darwin/release/libcf_node.dylib
              exit 0 ;;
            *)
              src="target/${{ matrix.target }}/release/libcf_node.so" ;;
          esac
          cp "$src" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
  npm-publish:
    name: npm (${{ matrix.package }})
    needs: [node-addon]
    # A version that already exists on npm must not fail the release build.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: web,                 dir: packages/web,                  artifact: "" }
          - { package: node,                dir: packages/node,                 artifact: "" }
          - { package: node-win32-x64,      dir: packages/node-win32-x64,       artifact: cf-node-win32-x64.node }
          - { package: node-win32-arm64,    dir: packages/node-win32-arm64,     artifact: cf-node-win32-arm64.node }
          - { package: node-darwin-universal, dir: packages/node-darwin-universal, artifact: cf-node-darwin-universal.node }
          - { package: node-linux-x64,      dir: packages/node-linux-x64,       artifact: cf-node-linux-x64.node }
          - { package: node-linux-arm64,    dir: packages/node-linux-arm64,     artifact: cf-node-linux-arm64.node }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Fetch the platform binary
        if: matrix.artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dir }}
      - name: Sync the version with the tag
        working-directory: ${{ matrix.dir }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          node -e "
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.version = process.argv[1];
          if (p.optionalDependencies) {
            for (const k of Object.keys(p.optionalDependencies)) p.optionalDependencies[k] = process.argv[1];
          }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          " "$tag"
          node -e "const p=require('./package.json');console.log(p.name,p.version)"
      - name: Normalise the addon name
        if: matrix.artifact != ''
        working-directory: ${{ matrix.dir }}
        run: |
          if [ -f "${{ matrix.artifact }}" ]; then mv -f "${{ matrix.artifact }}" cf-node.node; fi
      - name: Publish
        working-directory: ${{ matrix.dir }}
        run: npm publish --provenance --access public
  publish:
    needs: [build, wasm, android, ios, node-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.node
            dist/**/cf_wasm.wasm
            dist/**/worklet-processor.js
            dist/SHA256SUMS












